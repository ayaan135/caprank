name: Refresh data & deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 13-21 * * 1-5" # every 30 min during US market hours
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/cache@v4
        with:
          path: data/profiles.json
          key: profiles-${{ github.run_id }}
          restore-keys: profiles-
      - run: npm run fetch
        env: { PROFILE_LIMIT: 400 }
      - run: npm run build
        env:
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          BROKER_URL: ${{ vars.BROKER_URL }}
          PRO_URL: ${{ vars.PRO_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
