name: Refresh data & deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 13-21 * * 1-5" # every 30 min during US market hours
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run fetch
      - run: npm run build
        env:
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          BROKER_URL: ${{ vars.BROKER_URL }}
          PRO_URL: ${{ vars.PRO_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Commit refreshed quotes
        run: |
          git config user.name "caprank-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/quotes.json && git commit -m "data: refresh quotes [skip ci]" && git push || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
